name: nagaoka-watch

on:
  schedule:
    - cron: "17 * * * *"   # 每小時一次
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nagaoka-watch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check announcements
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python watch_nagaoka.py
      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state_nagaoka.json)" ]]; then
            git config user.name  "nagaoka-watch"
            git config user.email "actions@github.com"
            git add state_nagaoka.json
            git commit -m "nagaoka state: $(date -u +%F\ %T) UTC"
            git push
          fi
